name: Deploy to Xserver (develop)

on:
  push:
    branches: [develop]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bike-fit-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bike-fit-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (develop/test)
        run: npx ng build --configuration production --base-href /bikefit-dev/

      - name: Deploy to Xserver via FTPS (develop環境)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./bike-fit-app/dist/bike-fit-app/browser/
          server-dir: ${{ secrets.SERVER_DIR_DEV }}
