<div class="container">
  <h1 class="sr-only">あにまるランド</h1>

  <div class="intro-block">
    <img
      src="/hillclimb-character.png"
      alt="ヒルクライムを楽しむ「あにまるランド」のマスコットキャラクター"
      class="hero-image"
    />

    <p class="brand-tagline">ロードバイクのフィッティング、いろいろ計算できます</p>

    <p class="intro">
      サドルの高さ・前後位置、タイヤの空気圧まで、自転車のセッティングに関する計算をまとめました。数値は股下長や体重などから算出する目安なので、実際に乗りながら微調整して使ってください。
    </p>
  </div>

  <div class="tool-list">
    <a
      class="tool-card"
      *ngFor="let tool of tools"
      [routerLink]="tool.path"
    >
      <div class="tool-card-header">
        <span class="tool-name">{{ tool.name }}</span>
        <span class="tool-badge" *ngIf="!tool.ready">準備中</span>
      </div>
      <p class="tool-description">{{ tool.description }}</p>
    </a>
  </div>
</div>
